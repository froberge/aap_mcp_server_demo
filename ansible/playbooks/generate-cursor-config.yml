---
- name: Generate Cursor MCP configuration for AAP
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      host: "{{ openshift_api_server }}"
      api_key: "{{ openshift_token }}"
      validate_certs: "{{ openshift_validate_certs | bool }}"
  tasks:
    - name: Run AAP MCP Cursor config role
      ansible.builtin.import_role:
        name: aap_mcp
        tasks_from: generate_cursor_config
