---
- name: Refresh RHEL DNF metadata (safe repo fix)
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Require Red Hat family
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'RedHat'
        fail_msg: This playbook only applies to RHEL-family hosts.

    - name: Check subscription-manager status
      ansible.builtin.command: subscription-manager status
      register: sub_status
      changed_when: false
      failed_when: false

    # region agent log
    - name: agent debug emit subscription status
      ansible.builtin.debug:
        msg: >-
          AGENT_DEBUG {{ {
            'sessionId': '2da994',
            'runId': 'fix_repos',
            'hypothesisId': 'H1',
            'location': 'fix_linux_repos.yml:sub_status',
            'data': {
              'host': inventory_hostname,
              'sub_status_rc': sub_status.rc,
              'sub_status_stdout': sub_status.stdout | default('')
            }
          } | to_json }}
    # endregion

    - name: Fail when host is not registered (dnf makecache will not help)
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} is not registered with an entitlement server.
          Run your workshop registration steps first (subscription-manager register
          or rhc connect), then re-run this playbook or Deploy Linux Application.
          subscription-manager status:
          {{ sub_status.stdout | default('n/a') }}
      when: >-
        'not registered' in (sub_status.stdout | default('') | lower)
        or 'unable to read consumer identity' in (sub_status.stdout | default('') | lower)
        or sub_status.rc != 0

    - name: Refresh DNF metadata cache
      ansible.builtin.command: dnf makecache
      register: dnf_makecache
      changed_when: "'Metadata cache created' in dnf_makecache.stdout"

    - name: Verify httpd is available after cache refresh
      ansible.builtin.command: dnf list --available httpd
      register: httpd_avail
      changed_when: false

    - name: Report success
      ansible.builtin.debug:
        msg: >-
          httpd is available from enabled repos on {{ inventory_hostname }}.
          Re-run the Deploy Linux Application job template.

    - name: Report when httpd is still missing
      ansible.builtin.fail:
        msg: >-
          httpd is still not available after dnf makecache. Register the host or
          restore workshop RHUI/repos (subscription-manager status; dnf repolist),
          then install manually: dnf install -y httpd.
      when: httpd_avail.rc != 0
